<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6f263d">
  <meta name="description" content="DELIZZ — Cosméticos e acessórios. Encontre seus favoritos, ofertas e atendimento pelo WhatsApp.">
  <title>DELIZZ | Seus links</title>
  <style>
    :root {
      --wine: #70263d;
      --wine-dark: #4d1729;
      --cream: #f5efeb;
      --paper: #fffdfb;
      --ink: #332629;
      --muted: #95827e;
      --line: #eadfda;
      --rose-gold: #c69a8d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 34px 18px;
      display: flex; justify-content: center; align-items: center;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(198,154,141,.13), transparent 42%),
        linear-gradient(145deg, #f8f4f0 0%, #f1e9e4 100%);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .page { width: 100%; max-width: 440px; }
    .card {
      position: relative;
      background: var(--paper);
      border: 1px solid rgba(198,154,141,.30);
      border-radius: 25px;
      padding: 38px 27px 29px;
      box-shadow: 0 22px 60px rgba(67,34,39,.075);
      text-align: center;
    }
    .brand-logo {
      display: block; width: min(100%, 190px); height: auto;
      margin: 0 auto 10px; border-radius: 3px;
    }
    .phrase {
      margin: 10px 0 29px;
      color: var(--wine);
      font-family: Georgia, serif;
      font-size: 16px;
      font-style: italic;
      letter-spacing: .15px;
    }
    .eyebrow {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin: 0 0 13px; color: var(--rose-gold);
      font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
    }
    .eyebrow::before, .eyebrow::after {
      content: ""; width: 25px; height: 1px; background: #d9bdb3;
    }
    .links { display: grid; gap: 12px; }
    .link {
      display: flex; align-items: center; gap: 14px;
      min-height: 70px; padding: 13px 16px;
      border: 1px solid #eadfda; border-radius: 14px;
      background: #fff; color: var(--ink); text-decoration: none;
      text-align: left; transition: background .2s ease, color .2s ease, transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .link:hover,
    .link:focus-visible,
    .link:active {
      transform: translateY(-1px);
      background: var(--wine);
      color: #fff;
      border-color: var(--wine);
      box-shadow: 0 9px 22px rgba(76,35,43,.13);
      outline: none;
    }
    .link:hover .icon,
    .link:focus-visible .icon,
    .link:active .icon {
      background: rgba(255,255,255,.16);
      color: #fff;
    }
    .icon {
      flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%;
      display: grid; place-items: center; background: #f7f0ec; color: var(--wine);
      font-size: 19px; border: 1px solid #f0e5df;
    }
    .copy { min-width: 0; flex: 1; }
    .name { display: block; font-size: 12px; font-weight: 700; letter-spacing: 1.05px; }
    .detail { display: block; margin-top: 5px; color: #978783; font-family: Georgia, serif; font-size: 12px; }
    .link:hover .detail, .link:focus-visible .detail, .link:active .detail { color: rgba(255,255,255,.78); }
    .arrow { font-family: Georgia, serif; font-size: 22px; font-weight: 300; opacity: .55; }
    .footer {
      margin-top: 27px; color: #a18e88; font-size: 9px;
      letter-spacing: 2px; text-transform: uppercase;
    }
    .footer::before {
      content: ""; display: block; width: 34px; height: 1px;
      margin: 0 auto 15px; background: #d9bdb3;
    }
    @media (max-width: 380px) { .card { padding: 28px 18px 23px; } }
  </style>
